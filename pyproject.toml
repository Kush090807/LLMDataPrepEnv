[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-data-prep-env"
version = "1.0.0"
description = "An agentic environment for autonomous data cleaning."
requires-python = ">=3.9"
dependencies = [
    "pydantic",
    "openenv-core"
]
[project.scripts]
server = "server.app:main"
